{{- if .Values.backup.enabled }}
{{- /*
  S3-compatible object store for Barman: SeaweedFS (MinIO stopped publishing images in 2025).
  shortcut: single-replica store inside the same cluster; point backup-store at a real off-cluster bucket for production.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "backup-s3").data | default dict }}
{{- $key := get $existing "ACCESS_KEY_ID" | b64dec | default (randAlphaNum 16) }}
{{- $secretKey := get $existing "ACCESS_SECRET_KEY" | b64dec | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3
stringData:
  ACCESS_KEY_ID: {{ $key }}
  ACCESS_SECRET_KEY: {{ $secretKey }}
  s3.json: |
    {"identities": [{"name": "barman", "credentials": [{"accessKey": "{{ $key }}", "secretKey": "{{ $secretKey }}"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-store
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: object-store}
  template:
    metadata:
      labels: {app.kubernetes.io/name: object-store}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          args: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/s3/s3.json"]
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            tcpSocket: {port: s3}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3, mountPath: /etc/s3, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: object-store}
        - name: s3
          secret:
            secretName: backup-s3
            items: [{key: s3.json, path: s3.json}]
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
spec:
  selector: {app.kubernetes.io/name: object-store}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
# Barman does not create buckets; this one-shot job does (re-running is harmless).
apiVersion: batch/v1
kind: Job
metadata:
  name: backup-bucket-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mb
          image: amazon/aws-cli:2.27.0
          command: ["sh", "-c", "aws --endpoint-url http://object-store:9000 s3api head-bucket --bucket backups || aws --endpoint-url http://object-store:9000 s3 mb s3://backups"]
          env:
            - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: backup-s3, key: ACCESS_KEY_ID}}}
            - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backup-s3, key: ACCESS_SECRET_KEY}}}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backup-store
spec:
  retentionPolicy: {{ .Values.backup.retention | quote }}
  configuration:
    destinationPath: s3://backups/
    endpointURL: http://object-store:9000
    s3Credentials:
      accessKeyId: {name: backup-s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: backup-s3, key: ACCESS_SECRET_KEY}
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: banking-pg-daily
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  # no `immediate`: it would race the bucket hook; install.sh takes the first base backup
  backupOwnerReference: self
  cluster:
    name: banking-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
