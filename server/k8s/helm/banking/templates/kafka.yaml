{{- /* RF follows the broker count (max 3); min.insync.replicas=2 needs at least 3 brokers. */}}
{{- $rf := min 3 .Values.kafka.replicas }}
{{- $isr := ternary 2 1 (ge (int $rf) 3) }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: banking-kafka
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage }}
        kraftMetadata: shared
  resources: {{- toYaml .Values.kafka.resources | nindent 4 }}
  {{- with .Values.kafka.jvmOptions }}
  jvmOptions: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: banking-kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: {{ $rf }}
      transaction.state.log.replication.factor: {{ $rf }}
      transaction.state.log.min.isr: {{ $isr }}
      default.replication.factor: {{ $rf }}
      min.insync.replicas: {{ $isr }}
  entityOperator:
    topicOperator: {{- toYaml .Values.kafka.topicOperator | nindent 6 }}
  kafkaExporter:   # consumer-lag metrics for the Grafana dashboard
    topicRegex: ".*"
    groupRegex: ".*"
{{- range .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ . | replace "." "-" }}
  labels:
    strimzi.io/cluster: banking-kafka
spec:
  topicName: {{ . }}
  partitions: {{ $.Values.kafka.partitions }}
  replicas: {{ $rf }}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
spec:
  selector:
    matchLabels:
      strimzi.io/name: banking-kafka-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
{{- end }}
