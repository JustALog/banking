apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          {{- range $p := list "auth" "accounts" "transfers" "notifications" }}
          - path: /{{ $p }}
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port: {number: {{ index $.Values.apps "gateway-service" "port" }}}
          {{- end }}
