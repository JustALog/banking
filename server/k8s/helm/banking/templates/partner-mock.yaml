{{- /* Partner bank mock: same WireMock stubs as docker/wiremock/mappings (fast + 5s-slow path). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: partner-mock-mappings
data:
  partner-fast.json: |
    {"request": {"method": "POST", "urlPath": "/partner/v1/transfers"},
     "response": {"status": 200, "headers": {"Content-Type": "application/json"},
       "jsonBody": {"status": "ACCEPTED", "reference": "{{ "{{" }}randomValue length=12 type='ALPHANUMERIC' uppercase=true{{ "}}" }}"},
       "transformers": ["response-template"]}}
  partner-slow.json: |
    {"request": {"method": "POST", "urlPath": "/partner-slow/v1/transfers"},
     "response": {"status": 200, "headers": {"Content-Type": "application/json"}, "fixedDelayMilliseconds": 5000,
       "jsonBody": {"status": "ACCEPTED", "reference": "{{ "{{" }}randomValue length=12 type='ALPHANUMERIC' uppercase=true{{ "}}" }}"},
       "transformers": ["response-template"]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-mock
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: partner-mock}
  template:
    metadata:
      labels: {app.kubernetes.io/name: partner-mock}
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.9.1
          args: ["--port", "9090", "--global-response-templating"]
          ports:
            - {name: http, containerPort: 9090}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: mappings, mountPath: /home/wiremock/mappings, readOnly: true}
      volumes:
        - name: mappings
          configMap: {name: partner-mock-mappings}
---
apiVersion: v1
kind: Service
metadata:
  name: partner-mock
spec:
  selector: {app.kubernetes.io/name: partner-mock}
  ports:
    - {name: http, port: 9090, targetPort: http}
