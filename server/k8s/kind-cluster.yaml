# Single-node kind cluster; host :80/:443 go to ingress-nginx (http://localhost -> gateway-service).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: banking
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 80, protocol: TCP}
      - {containerPort: 443, hostPort: 443, protocol: TCP}
