# Discover ServiceMonitors/PodMonitors and dashboards from every namespace, not only this release's.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 3d
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
grafana:
  adminPassword: admin   # dev only
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
alertmanager:
  enabled: false
