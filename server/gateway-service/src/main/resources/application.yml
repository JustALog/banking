server:
  port: 8080

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${BANKING_JWT_PUBLIC_KEY:file:../docker/keys/jwt-public.pem}
  cloud:
    gateway:
      routes:
        # Service-to-service only (transfer -> ledger, unchecked ownership): never reachable from outside.
        # Must stay above the /accounts/** route.
        - id: block-internal
          uri: no://op
          predicates:
            - Path=/accounts/internal/**
          filters:
            - SetStatus=404

        - id: auth-service
          uri: ${BANKING_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: ledger-service
          uri: ${BANKING_LEDGER_URL:http://localhost:8082}
          predicates:
            - Path=/accounts/**

        - id: transfer-service
          uri: ${BANKING_TRANSFER_URL:http://localhost:8083}
          predicates:
            - Path=/transfers/**
          filters:
            - name: IdempotencyKey

        - id: notification-service
          uri: ${BANKING_NOTIFY_URL:http://localhost:8085}
          predicates:
            - Path=/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    vn.banking: INFO
    org.springframework.cloud.gateway: INFO
