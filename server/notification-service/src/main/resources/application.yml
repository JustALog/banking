server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: ${BANKING_DB_URL:jdbc:postgresql://localhost:5432/notify_db}
    username: ${BANKING_DB_USER:notify}
    password: ${BANKING_DB_PASSWORD:notify}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${BANKING_JWT_PUBLIC_KEY:file:../docker/keys/jwt-public.pem}
  kafka:
    bootstrap-servers: ${BANKING_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
      observation-enabled: true   # continue the trace from the "traceparent" header

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    vn.banking: INFO
