name: backend-ci

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - run: bash docker/keys/generate-keys.sh
      - run: mvn -B verify
